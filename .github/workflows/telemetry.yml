name: telemetry

# The contribution numbers are baked into assets/readme.svg, so they need a
# nightly rebuild. Without this they freeze at whatever the last commit held.
on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Pull contribution calendar
        run: python3 build/fetch_contributions.py "${{ github.repository_owner }}"

      - name: Recompose readme.svg
        run: python3 build/build.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build/cache/contrib.json assets/readme.svg
          git diff --quiet --cached || git commit -m "chore: refresh telemetry"
          git push
